spring:
  application:
    name: realtime-chatapp-service-registery
server:
  port: 8761

eureka:
  instance:
    hostname: localhost
  client:
    fetch-registry: false
    register-with-eureka: false

management:
  tracing:
    sampling:
      probability: 1.0 # 100% sampling for development
  otlp:
    metrics:
      export:
        url: ${OTEL_METRICS_URI:}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_URI:}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_LOGS_URI:}
